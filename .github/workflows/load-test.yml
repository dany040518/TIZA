name: Load Test — k6

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL to test (e.g. https://tiza.vercel.app)'
        required: true
        default: 'https://tiza.vercel.app'
      test_type:
        description: 'Test type'
        required: true
        default: 'smoke'
        type: choice
        options: [smoke, load]

jobs:
  k6-test:
    name: Run k6 ${{ inputs.test_type }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install k6
        run: |
          curl -s https://dl.k6.io/key.gpg | gpg --dearmor | sudo tee /usr/share/keyrings/k6-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update -qq && sudo apt-get install -y k6

      - name: Run k6 ${{ inputs.test_type }}
        run: |
          k6 run load-tests/${{ inputs.test_type }}.js \
            -e BASE_URL=${{ inputs.target_url }} \
            --out json=results.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-results-${{ github.run_number }}
          path: results.json
          retention-days: 14

      - name: Summary
        if: always()
        run: |
          echo "### k6 ${{ inputs.test_type }} — ${{ inputs.target_url }}" >> $GITHUB_STEP_SUMMARY
          echo "Results saved as artifact \`k6-results-${{ github.run_number }}\`" >> $GITHUB_STEP_SUMMARY